name: Dashboard Diagnostics

on:
  push:
    branches:
      - feature/hermes-dashboard
    paths:
      - .github/workflows/dashboard-diagnostics.yml

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agent-modal
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Install pinned Modal CLI
        run: python -m pip install --disable-pip-version-check modal==1.5.5
      - name: Read sanitized Hermes GUI lifecycle logs
        shell: bash
        run: |
          set -euo pipefail
          modal volume ls agent-hermes-home logs --json || true
          modal volume get agent-hermes-home logs/gui.log /tmp/gui.log --force
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('/tmp/gui.log')
          lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
          keep = re.compile(r'(?i)(pty|websocket|\bws\b|disconnect|closed|close code|gateway|heartbeat|ping|1006|4409|4410)')
          secret_qs = re.compile(r'(?i)((?:ticket|token|internal|authorization|cookie)=)[^&\s]+')
          bearer = re.compile(r'(?i)(bearer\s+)[A-Za-z0-9._~+/=-]+')
          selected = []
          for line in lines[-5000:]:
              if keep.search(line):
                  line = secret_qs.sub(r'\1<redacted>', line)
                  line = bearer.sub(r'\1<redacted>', line)
                  selected.append(line)
          print(f'GUI_LIFECYCLE_MATCHES={len(selected)}')
          for line in selected[-800:]:
              print(line)
          PY
