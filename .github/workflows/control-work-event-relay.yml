name: Control Work event relay

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  relay:
    if: ${{
        github.repository == 'market-predictions/agent' &&
        github.event.issue.number == 3 &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'control-runtime-actuator[bot]' &&
        startsWith(github.event.comment.body, 'CONTROL_WORK_POC_REQUEST_20261009')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Relay the already authorized Control request through native GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)
          comment = event["comment"]
          if (event["repository"]["full_name"] != "market-predictions/agent"
                  or event["issue"]["number"] != 3
                  or not event["issue"].get("pull_request")
                  or comment["user"]["login"] != "control-runtime-actuator[bot]"
                  or (comment.get("performed_via_github_app") or {}).get("slug")
                      != "control-runtime-actuator"):
              raise SystemExit("untrusted Control event")
          lines = comment["body"].splitlines()
          if (len(lines) != 3
                  or lines[0] != "CONTROL_WORK_POC_REQUEST_20261009"
                  or lines[1] != "CONTROL_INTERACTIVE_WORK_V1"):
              raise SystemExit("not a supported Control Work request")
          capsule = json.loads(lines[2])
          if (capsule.get("protocol") != "CONTROL_V4_RUNTIME_RESULT_V1"
                  or capsule.get("result") != "WORK"
                  or capsule.get("repository") != "market-predictions/agent"
                  or capsule.get("action") != "REPAIR"
                  or (capsule.get("candidate") or {}).get("candidate_pr_number") != 3
                  or not re.fullmatch(r"v41:gh:[1-9][0-9]{5,19}", capsule.get("run_id", ""))):
              raise SystemExit("Control Work capsule is invalid")
          parent_id = comment["id"]
          if type(parent_id) is not int or parent_id <= 0:
              raise SystemExit("missing immutable source comment id")
          body = comment["body"] + "\nsource_comment_id=" + str(parent_id)
          request = Request(
              "https://api.github.com/repos/market-predictions/agent/issues/3/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              created = json.load(response)
          if created.get("body") != body or not isinstance(created.get("id"), int):
              raise SystemExit("native Work handoff was not confirmed")
          print("CONTROL_WORK_RELAY_COMMENT_ID=" + str(created["id"]))
          PY
