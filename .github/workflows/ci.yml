name: Agent CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned deployment tooling
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q agent_carrier.py agent_budget_plugin.py interactive_dashboard.py modal_app.py runtime_versions.py runtime/hermes_host_policy scripts tests
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Import Modal app without deployment credentials
        run: python -c "import modal_app; assert modal_app.app is not None"
      - name: Verify bounded dry-run plan
        run: |
          python agent_carrier.py \
            --task-id ci-bootstrap \
            --objective "Research a public technical standard." \
            --freellmapi-base-url https://freellm.example/v1 \
            > /tmp/agent-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/agent-plan.json').read_text())
          assert plan['data_class'] == 'PUBLIC_NON_PERSONAL'
          assert plan['agent_runtime'] == 'hermes'
          assert plan['inference_gateway'] == 'freellmapi'
          assert plan['provider'] == 'freellmapi'
          assert plan['model'] == 'auto'
          assert plan['toolsets'] == ['web']
          assert plan['budget']['max_concurrent_tasks'] == 1
          assert plan['budget']['max_retries'] == 1
          assert plan['budget']['max_tool_calls'] == 20
          PY

  upstream-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact Hermes commit through upstream-supported source path
        run: |
          set -euo pipefail
          HERMES_REPO="$(python -c 'import runtime_versions; print(runtime_versions.HERMES_REPOSITORY)')"
          HERMES_COMMIT="$(python -c 'import runtime_versions; print(runtime_versions.HERMES_COMMIT)')"
          git clone --filter=blob:none "$HERMES_REPO" /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout --detach "$HERMES_COMMIT"
          test "$(git -C /tmp/hermes-agent rev-parse HEAD)" = "$HERMES_COMMIT"
          mkdir -p /tmp/hermes-agent/plugins/agent-host-policy
          cp runtime/hermes_host_policy/plugin.yaml /tmp/hermes-agent/plugins/agent-host-policy/plugin.yaml
          cp runtime/hermes_host_policy/__init__.py /tmp/hermes-agent/plugins/agent-host-policy/__init__.py
          python -m pip install --disable-pip-version-check -e /tmp/hermes-agent
          python -m pip install --disable-pip-version-check \
            'exa-py==2.10.2' \
            'firecrawl-py==4.17.0' \
            'parallel-web==0.4.2'
          hermes --version
      - name: Prove pinned native dashboard hosted policy
        run: |
          set -euo pipefail
          hermes dashboard --help >/tmp/hermes-dashboard-help.txt
          grep -q -- '--host' /tmp/hermes-dashboard-help.txt
          grep -q -- '--no-open' /tmp/hermes-dashboard-help.txt
          python - <<'PY'
          import asyncio
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          import interactive_dashboard as policy
          from hermes_cli import managed_scope
          from hermes_cli.provider_catalog import provider_catalog

          catalog_names = frozenset(
              name
              for descriptor in provider_catalog()
              for name in descriptor.api_key_env_vars
              if name
          )
          names = policy.provider_secret_names()
          assert names == catalog_names
          assert 'OPENAI_API_KEY' in names

          source_env = {
              'FREELLMAPI_API_KEY': 'freellmapi-ci',
              'MODAL_PROXY_KEY': 'proxy-key',
              'MODAL_PROXY_SECRET': 'proxy-secret',
              'HERMES_DASHBOARD_OAUTH_CLIENT_ID': 'agent:ci',
          }
          hosted_env = policy.build_dashboard_environment(
              'https://gateway.example', source_env,
              direct_provider_secret_names=names,
          )
          assert hosted_env['FREELLMAPI_BASE_URL'] == 'https://gateway.example/v1'
          assert hosted_env['HERMES_GATEWAY_SESSION'] == '1'
          assert policy.dashboard_command() == [
              'hermes', 'dashboard', '--host', '0.0.0.0', '--port', '9119', '--no-open']

          with tempfile.TemporaryDirectory() as tmp:
              managed = Path(tmp) / 'managed'
              home = Path(tmp) / 'home'
              managed.mkdir()
              home.mkdir()
              (managed / 'config.yaml').write_text(
                  json.dumps(policy.load_managed_policy()),
                  encoding='utf-8',
              )
              policy.materialize_managed_env_policy(names, managed / '.env')
              os.environ['HERMES_MANAGED_DIR'] = str(managed)
              os.environ['HERMES_HOME'] = str(home)
              os.environ['FREELLMAPI_BASE_URL'] = hosted_env['FREELLMAPI_BASE_URL']
              os.environ['HERMES_GATEWAY_SESSION'] = '1'
              managed_scope.invalidate_managed_cache()

              assert managed_scope.is_key_managed('model.provider')
              assert managed_scope.is_key_managed('plugins.enabled')
              assert managed_scope.is_env_managed('OPENAI_API_KEY')
              assert all(managed_scope.is_env_managed(name) for name in names)
              merged = managed_scope.apply_managed_overlay({
                  'model': {'provider': 'openai'},
                  'fallback_providers': [{'provider': 'openai', 'model': 'gpt'}],
                  'platform_toolsets': {'cli': ['terminal']},
                  'plugins': {'enabled': ['other-plugin']},
              })
              assert merged['model']['provider'] == 'freellmapi'
              assert merged['fallback_providers'] == []
              assert merged['fallback_model'] == []
              assert merged['platform_toolsets']['cli'] == ['web', 'memory', 'session_search']
              assert merged['plugins']['enabled'] == ['agent-host-policy']

              from hermes_cli.fallback_config import get_fallback_chain
              assert get_fallback_chain(merged) == []

              # Native dashboard bootstrap discovers the bundled policy plugin
              # before start_server(), including its normal OAuth providers.
              sys.argv = ['hermes', 'dashboard']
              from hermes_cli import plugins
              plugins.discover_plugins(force=True)
              manager = plugins.get_plugin_manager()
              assert 'agent-host-policy' in manager._plugins

              # Exact pinned toolsets resolve to four allowed names; every other
              # execution is blocked by Hermes' native fail-closed pre_tool hook.
              from toolsets import resolve_toolset
              safe_tools = set()
              for toolset in ('web', 'memory', 'session_search'):
                  safe_tools.update(resolve_toolset(toolset, include_registry=False))
              assert safe_tools == {'web_search', 'web_extract', 'memory', 'session_search'}
              for safe in sorted(safe_tools):
                  block, _ = plugins._dispatch_pre_tool_call_hooks(safe, {})
                  assert block is None, (safe, block)
              for unsafe in ('terminal', 'write_file', 'delegate_task', 'cronjob_manage'):
                  block, _ = plugins._dispatch_pre_tool_call_hooks(unsafe, {})
                  assert block and 'Hosted dashboard policy blocks tool' in block, (unsafe, block)

              # A session-scoped /model change cannot escape at inference time:
              # invalid provider/base/model never reaches the downstream call.
              from hermes_cli.middleware import run_llm_execution_middleware
              downstream = []
              def provider_call(request):
                  downstream.append(request)
                  return 'provider-ok'

              assert run_llm_execution_middleware(
                  {'messages': []}, provider_call,
                  provider='freellmapi', model='auto', base_url='https://gateway.example/v1',
              ) == 'provider-ok'
              assert len(downstream) == 1
              assert run_llm_execution_middleware(
                  {'messages': []}, provider_call,
                  provider='openai', model='gpt', base_url='https://api.openai.com/v1',
              ) is None
              assert len(downstream) == 1

              from hermes_cli import web_server, web_server_chat
              assert web_server.should_require_auth('0.0.0.0') is True
              assert web_server_chat.PTY_REGISTRY._max == 1

              middleware = [
                  item for item in web_server.app.user_middleware
                  if getattr(getattr(item, 'cls', None), '__name__', '') == 'HostedDashboardPolicyMiddleware'
              ]
              assert len(middleware) == 1
              middleware_cls = middleware[0].cls
              reached = []
              sent = []
              async def downstream_app(scope, receive, send):
                  reached.append((scope['type'], scope.get('path')))
              async def receive():
                  return {'type': 'http.disconnect'}
              async def send(message):
                  sent.append(message)
              fence = middleware_cls(downstream_app)

              asyncio.run(fence(
                  {'type': 'http', 'method': 'PUT', 'path': '/api/config', 'query_string': b''},
                  receive, send))
              assert sent[0]['status'] == 403 and not reached

              sent.clear()
              asyncio.run(fence(
                  {'type': 'http', 'method': 'POST', 'path': '/api/sessions/x', 'query_string': b''},
                  receive, send))
              assert reached[-1] == ('http', '/api/sessions/x')

              sent.clear()
              before = len(reached)
              asyncio.run(fence(
                  {'type': 'websocket', 'path': '/api/console', 'query_string': b''},
                  receive, send))
              assert sent[-1]['code'] == 4403 and len(reached) == before

              sent.clear()
              asyncio.run(fence(
                  {'type': 'websocket', 'path': '/api/pty', 'query_string': b'ticket=x'},
                  receive, send))
              assert sent[-1]['code'] == 4403 and len(reached) == before

              sent.clear()
              asyncio.run(fence(
                  {'type': 'websocket', 'path': '/api/pty', 'query_string': b'attach=tab-1'},
                  receive, send))
              assert reached[-1] == ('websocket', '/api/pty')

              # Exact upstream PTY construction inherits HERMES_GATEWAY_SESSION;
              # exact upstream bang_shell_enabled() therefore fails closed.
              from tools.environments.local import build_subprocess_env
              child_env = build_subprocess_env(scrub_secrets=False, inherit_profile_home=True)
              assert child_env.get('HERMES_GATEWAY_SESSION') == '1'
              from hermes_cli.bang_shell import bang_shell_enabled
              assert bang_shell_enabled() is False
          PY
      - name: Pull exact FreeLLMAPI image digest
        run: |
          IMAGE="$(python -c 'import runtime_versions; print(runtime_versions.FREELLMAPI_IMAGE)')"
          docker pull "$IMAGE"
      - name: Prove FreeLLMAPI model and real Hermes tool path
        run: bash scripts/ci_runtime_probe.sh
