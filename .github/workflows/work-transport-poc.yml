name: Work transport POC — read-only correlation

# Temporary diagnostic observer. Does not alter Control runtime, queue, or PR.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  correlate:
    if: >-
      ${{
        github.repository == 'market-predictions/agent' &&
        github.event.issue.pull_request &&
        github.event.issue.number == 3 &&
        startsWith(github.event.comment.body, 'CONTROL_WORK_POC_RESULT_20261009 ')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Correlate Work transport without semantic authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.work_transport_poc
