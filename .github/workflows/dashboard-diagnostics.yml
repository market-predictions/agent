name: Dashboard Diagnostics

on:
  push:
    branches:
      - feature/hermes-dashboard
    paths:
      - .github/workflows/dashboard-diagnostics.yml

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agent-modal
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Install pinned Modal CLI
        run: python -m pip install --disable-pip-version-check modal==1.5.5
      - name: Read recent production logs
        run: modal app logs agent-carrier --since 30m --tail 500 --timestamps
