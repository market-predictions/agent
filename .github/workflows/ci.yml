name: Agent CI

on:
  pull_request:
  push:
    branches:
      - main
      - bootstrap/agent-r1-gap-01

permissions:
  contents: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned deployment tooling
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q agent_carrier.py modal_app.py runtime_versions.py tests
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Import Modal app without deployment credentials
        run: python -c "import modal_app; assert modal_app.app is not None"
      - name: Verify bounded dry-run plan
        run: |
          python agent_carrier.py \
            --task-id ci-bootstrap \
            --objective "Research a public technical standard." \
            --freellmapi-base-url https://freellm.example/v1 \
            > /tmp/agent-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/agent-plan.json').read_text())
          assert plan['data_class'] == 'PUBLIC_NON_PERSONAL'
          assert plan['agent_runtime'] == 'hermes'
          assert plan['inference_gateway'] == 'freellmapi'
          assert plan['model'] == 'auto'
          assert plan['toolsets'] == ['web']
          assert plan['budget']['max_concurrent_tasks'] == 1
          PY

  upstream-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact Hermes commit and exact web backends
        run: |
          HERMES_SPEC="$(python -c 'import runtime_versions; print(runtime_versions.HERMES_GIT_SPEC)')"
          python -m pip install --disable-pip-version-check \
            "$HERMES_SPEC" \
            'exa-py==2.10.2' \
            'firecrawl-py==4.17.0' \
            'parallel-web==0.4.2'
          hermes --version
      - name: Pull exact FreeLLMAPI image digest
        run: |
          IMAGE="$(python -c 'import runtime_versions; print(runtime_versions.FREELLMAPI_IMAGE)')"
          docker pull "$IMAGE"
      - name: Boot FreeLLMAPI and prove gateway, model, and Hermes path
        env:
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FREELLMAPI_API_KEY: freellmapi-ci-integration-key
          MODAL_PROXY_KEY: wk-ci-local
          MODAL_PROXY_SECRET: ws-ci-local
        run: |
          set -euo pipefail
          IMAGE="$(python -c 'import runtime_versions; print(runtime_versions.FREELLMAPI_IMAGE)')"
          cleanup() { docker rm -f agent-freeapi-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run --rm -d \
            --name agent-freeapi-ci \
            -p 3001:3001 \
            -e ENCRYPTION_KEY \
            -e FREELLMAPI_API_KEY \
            -e FREEAPI_CONFIG_PATH=/app/agent-freellmapi-default.json \
            -v "$PWD/runtime/freellmapi-bootstrap.mjs:/app/agent-freellmapi-bootstrap.mjs:ro" \
            -v "$PWD/runtime/freellmapi.default.json:/app/agent-freellmapi-default.json:ro" \
            "$IMAGE" \
            sh -lc 'node /app/agent-freellmapi-bootstrap.mjs >/dev/null && exec node server/dist/index.js'

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/api/ping >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs agent-freeapi-ci
              exit 1
            fi
            sleep 1
          done

          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/v1/models)"
          test "$unauth_status" = "401"

          curl --fail --silent \
            -H "Authorization: Bearer $FREELLMAPI_API_KEY" \
            http://127.0.0.1:3001/v1/models \
            > /tmp/models.json

          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/models.json').read_text())
          assert body['object'] == 'list'
          assert any(item.get('id') == 'auto' for item in body['data'])
          PY

          curl --fail --silent --show-error --max-time 180 \
            -D /tmp/model-headers.txt \
            -H "Authorization: Bearer $FREELLMAPI_API_KEY" \
            -H 'Content-Type: application/json' \
            http://127.0.0.1:3001/v1/chat/completions \
            -d '{"model":"auto","messages":[{"role":"user","content":"Reply with one short sentence confirming you can answer."}],"max_tokens":64,"stream":false}' \
            > /tmp/model.json

          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/model.json').read_text())
          text = body['choices'][0]['message'].get('content') or ''
          assert text.strip(), body
          headers = Path('/tmp/model-headers.txt').read_text().lower()
          assert 'x-routed-via:' in headers, headers
          PY

          python agent_carrier.py \
            --execute \
            --task-id ci-real-hermes \
            --objective "Find one public technical fact about HTTP semantics and cite the public source you looked up." \
            --freellmapi-base-url http://127.0.0.1:3001/v1 \
            > /tmp/hermes-result.json

          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/hermes-result.json').read_text())
          assert result['status'] == 'CANDIDATE', result
          assert result['result']['claims'], result
          assert result['usage'] is None or result['usage'].get('api_calls', 0) >= 2, result
          PY
