name: Deploy Agent to Modal

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run one real Hermes -> FreeLLMAPI smoke test after deploy
        required: true
        default: true
        type: boolean
      run_qualification:
        description: Run the fixed 20-task Phase-1 qualification after deploy
        required: true
        default: false
        type: boolean
  # One-shot autonomous promotion for the corrected public OAuth client id.
  # Remove this trigger immediately after the production verification succeeds.
  push:
    branches:
      - feature/hermes-dashboard
    paths:
      - runtime_versions.py

permissions:
  contents: read

concurrency:
  group: agent-modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: agent-modal
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Modal CLI
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Refuse missing deployment credentials
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          modal token info
      - name: Bootstrap Modal runtime secrets once
        run: python -m scripts.bootstrap_modal_runtime
      - name: Deploy pinned runtime
        run: modal deploy modal_app.py
      - name: Dashboard production auth-gate smoke
        run: python -m scripts.dashboard_smoke
      - name: Capture dashboard failure logs
        if: ${{ failure() }}
        run: modal app logs agent-carrier --since 15m --tail 300 --timestamps
      - name: End-to-end bounded-worker smoke
        if: ${{ (github.event_name == 'push' || inputs.run_smoke) && success() }}
        run: modal run modal_app.py::smoke
      - name: Fixed 20-task Phase-1 qualification
        if: ${{ inputs.run_qualification && success() }}
        run: python -m scripts.phase1_qualification
      - name: Preserve qualification evidence
        if: ${{ always() && inputs.run_qualification }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase1-qualification-${{ github.sha }}
          path: qualification/evidence/phase1-qualification.json
          if-no-files-found: error
          retention-days: 30
